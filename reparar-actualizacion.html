<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reparar actualización · Control de Tanques</title><style>body{font:18px system-ui;background:#faf7f7;color:#282326;max-width:540px;margin:12vh auto;padding:24px}button{background:#b51a32;color:white;border:0;border-radius:14px;padding:17px 24px;font-size:18px;font-weight:700}p{line-height:1.5}</style></head><body><h2>Control de Tanques</h2><p>Esta reparación actualiza los archivos de la aplicación. No borra los registros locales ni las visitas guardadas.</p><button id="go">Reparar actualización</button><p id="status"></p><script>document.getElementById('go').onclick=async()=>{const status=document.getElementById('status');status.textContent='Reparando archivos de actualización…';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/control-de-tanques/')).map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('control-tanques-demo-')).map(k=>caches.delete(k)));}status.textContent='Listo. Abriendo la versión publicada…';location.replace('./index.html?reparacion='+Date.now());}catch(e){status.textContent='No se ha podido completar: '+e.message;}};</script></body></html>
